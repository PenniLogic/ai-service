[project]
name = "pennilogic-ai-service"
version = "0.1.0"
description = "PenniLogic AI service: health-only backend scaffold (no provider routing, no inference)."
readme = "docs/development.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
]

[project.scripts]
ai-service = "ai_service.server:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_service"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Generated by PenniLogic/infra governance; owned and checked there, not by this lint policy.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "A",    # shadowed builtins
    "ANN",  # type annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "F",    # pyflakes
    "I",    # isort
    "ISC",  # implicit string concatenation
    "N",    # naming
    "PIE",  # misc lints
    "PL",   # pylint
    "PT",   # pytest style
    "RET",  # return statements
    "RUF",  # ruff-specific
    "S",    # bandit security checks
    "SIM",  # simplify
    "T20",  # no print statements in runtime code
    "TRY",  # exception handling
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the pytest idiom
    "S104",  # "0.0.0.0" appears as a literal in configuration test vectors
    "S603",  # subprocess calls use fixed, non-shell argument lists
    "PLR2004",  # literal status codes and ports are the assertions themselves
    "TRY003",  # synthetic failure messages are inline in tests
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]
